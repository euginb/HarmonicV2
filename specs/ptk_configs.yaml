# ============================================================================
# ptk_configs.yaml — результаты шага 1 «Расчёт» (SPEC-10).
# Пишет МАШИНА: python main.py calc --publish → specs/ptk_configs.yaml
#
# Руками НЕ править: теряется на следующем прогоне. Управляющие параметры шага 1 —
# specs/ptk_input.yaml (диапазоны перебора) и specs/vendor_prices.yaml (тела качения,
# подшипники, штифты, цены); стартовые значения пределов — там же.
#
# Формат — комментированный YAML (Д-106): каждый ключ снабжён комментарием, в шапке
# глоссарий. Данные те же, что были в ptk_configs.json: шаг 2 читает этот файл как
# ОПУБЛИКОВАННЫЙ вход (связка шаг 1 → шаг 2, Д-79).
#
# СОКРАЩЕНИЯ
#   u           число тел качения в одном ряду (в исполнении — сумма по рядам).
#   z           число зубьев/окон сепаратора = u + 1 (запас на подрез профиля).
#   R_Σ (R_sum) наименьший радиус наружного профиля по подрезу и перемычке сепаратора.
#   a_ω (a_w)   coefficient профиля: смещение центра дуги; больше — меньше угол давления.
#   α (alpha_max) максимальный угол давления на зубе, °.
#   D_г (Dgen)  диаметр генератора волн (подшипник/магнит), мм.
#   d_root, d_tip  диаметры впадин и вершин зубьев венца, мм.
#   sep_web     перемычка (толщина тела) сепаратора между окнами, мм.
#   d_bc        диаметр окружности крепёжных отверстий венца, мм.
#   d_out       наружный диаметр венца, мм.
#   M_H, M_B    моменты, выдерживаемые венцом (H — holder) и подшипником генератора (B), Н·мм.
#   t_hold      момент удержания венца крепежом и посадкой, Н·мм.
#   Drol_max    наибольший допустимый диаметр тела качения для этого исполнения, мм.
#   ecc         эксцентрик .03; De — наружный Ø, t — толщина, a — эксцентриситет.
#   U           дисбаланс, г·мм; res — остаточный после балансировки.
#   φ (phi)     угол поворота ряда, °; cage — угловое смещение окна сепаратора, °.
# ============================================================================

  # Число тел качения в одном ряду, шт (в исполнении — сумма по рядам).
- u: 10
  # Ключ тела качения из vendor_prices.yaml → rollers (R_D3x8, B_D3…).
  roller: R_D3x8
  # Ø тела качения, мм.
  Drol: 3.0
  # ID исполнения: PTK-<u>-<тело>-<отверстия>-<хэш геометрии> (Д-80); хэш — от geom.
  id: PTK-010-R3X8-8M4P2-F11461
  # Число окон (гнёзд) сепаратора, шт.
  n: 10
  # Число зубьев профиля сепаратора = u + 1: запас на подрез профиля.
  z: 11
  # Коэффициент профиля a_ω: смещение центра дуги; больше — меньше угол давления.
  a_w: 0.6
  # Наименьший R_Σ наружного профиля — максимум по подрезу и перемычке сепаратора, мм (Д-38).
  R_sum: 11.0
  # Чем определён R_Σ: «подрез» (профиль зуба) или «сепаратор» (перемычка).
  R_by: подрез
  # Ø генератора волн (подшипник или магнит), мм.
  Dgen: 19.0
  # Подшипник генератора (618xx) при gen = bearing; иначе null.
  bearing: "61800"
  # Тип генератора волн: bearing | eccentric | magnet.
  gen: bearing
  # Ø впадин зубьев венца, мм.
  d_root: 26.2
  # Ø вершин зубьев венца, мм.
  d_tip: 23.8
  # Максимальный угол давления на зубе, ° (ограничение зацепления).
  alpha_max: 31.0
  # Радиус вершины зуба, мм.
  r_tip: 0.357
  # Перемычка сепаратора между окнами (толщина тела), мм.
  sep_web: 3.39
  # Отверстия крепления венца: «8×M4+2шт Ø4» — n×резьба + штифты.
  holes: 8×M4+2шт Ø4
  # Схема крепления венца: резьба × число + шаг (M4x8P2).
  mount: M4x8P2
  # Ø окружности крепёжных отверстий венца, мм.
  d_bc: 38.7
  # Наружный Ø венца, мм.
  d_out: 52.0
  # Ширина пакета (осевая длина исполнения), мм.
  width: 37.0
  # Наибольший допустимый Ø тела качения для исполнения, мм.
  Drol_max: 9.73
  # Момент удержания венца крепежом и посадкой, Н·мм.
  t_hold: 76.2
  # Момент, который выдерживает венец (крепёж и посадка), Н·мм.
  M_H: 66.1
  # Момент, который выдерживает подшипник генератора, Н·мм.
  M_B: 19.9
  # Принятый момент исполнения M = min(M_H, M_B), Н·мм.
  M: 19.9
  # Чем ограничен момент: «венец» | «подшипник».
  M_by: подшипник
  # Число вариантов исполнения венца (фаз), шт.
  ring_variants: 2
  # Фазовка рядов тел качения: один ряд = одно окно сепаратора со смещением.
  phasing:
      # Номер ряда (1…N).
    - row: 1
      # Угол поворота ряда относительно ряда 1, °.
      phi: 0.0
      # Смещение ряда в долях шага тел p, °.
      delta_p: 0.0
      # Угловое смещение окна ряда для равномерного износа, °.
      s: 0.0
      # Угловое положение окна сепаратора для этого ряда, °.
      cage: 0.0
      # Буква варианта венца (A, B, C…): варианты различаются смещением окон.
      variant: A
      # То же смещение по дуге, мм.
      s_arc_mm: 0.0
      # Номер ряда (1…N).
    - row: 2
      # Угол поворота ряда относительно ряда 1, °.
      phi: 90.0
      # Смещение ряда в долях шага тел p, °.
      delta_p: 0.75
      # Угловое смещение окна ряда для равномерного износа, °.
      s: 8.1818
      # Угловое положение окна сепаратора для этого ряда, °.
      cage: 18.0
      # Буква варианта венца (A, B, C…): варианты различаются смещением окон.
      variant: B
      # То же смещение по дуге, мм.
      s_arc_mm: 2.763
      # Номер ряда (1…N).
    - row: 3
      # Угол поворота ряда относительно ряда 1, °.
      phi: 180.0
      # Смещение ряда в долях шага тел p, °.
      delta_p: 0.5
      # Угловое смещение окна ряда для равномерного износа, °.
      s: 0.0
      # Угловое положение окна сепаратора для этого ряда, °.
      cage: 18.0
      # Буква варианта венца (A, B, C…): варианты различаются смещением окон.
      variant: A
      # То же смещение по дуге, мм.
      s_arc_mm: 0.0
      # Номер ряда (1…N).
    - row: 4
      # Угол поворота ряда относительно ряда 1, °.
      phi: 270.0
      # Смещение ряда в долях шага тел p, °.
      delta_p: 0.25
      # Угловое смещение окна ряда для равномерного износа, °.
      s: 8.1818
      # Угловое положение окна сепаратора для этого ряда, °.
      cage: 0.0
      # Буква варианта венца (A, B, C…): варианты различаются смещением окон.
      variant: B
      # То же смещение по дуге, мм.
      s_arc_mm: 2.763
  # Детали исполнения с их вариантами (суффикс файла: <ID>.<позиция><вариант>).
  parts:
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.01A
      # Наименование детали.
      name: венец
      # Буква варианта детали (A, B, C…).
      variant: A
      # Смещение окон (угол), °.
      s: 0.0
      # Смещение окон по дуге, мм.
      s_arc_mm: 0.0
      # Номера рядов, в которых применяется этот вариант.
      rows: [1, 3]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.01B
      # Наименование детали.
      name: венец
      # Буква варианта детали (A, B, C…).
      variant: B
      # Смещение окон (угол), °.
      s: 8.1818
      # Смещение окон по дуге, мм.
      s_arc_mm: 2.763
      # Номера рядов, в которых применяется этот вариант.
      rows: [2, 4]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.02
      # Наименование детали.
      name: сепаратор
      # Буква варианта детали (A, B, C…).
      variant: ""
      # Номера рядов, в которых применяется этот вариант.
      rows: [1, 2, 3, 4]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.03A
      # Наименование детали.
      name: эксцентрик
      # Буква варианта детали (A, B, C…).
      variant: A
      # Угол шпоночного паза детали от эксцентриситета, °.
      key_angle: 45.0
      # Номера рядов, в которых применяется этот вариант.
      rows: [1]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.03B
      # Наименование детали.
      name: эксцентрик
      # Буква варианта детали (A, B, C…).
      variant: B
      # Угол шпоночного паза детали от эксцентриситета, °.
      key_angle: 315.0
      # Номера рядов, в которых применяется этот вариант.
      rows: [2]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.03C
      # Наименование детали.
      name: эксцентрик
      # Буква варианта детали (A, B, C…).
      variant: C
      # Угол шпоночного паза детали от эксцентриситета, °.
      key_angle: 225.0
      # Номера рядов, в которых применяется этот вариант.
      rows: [3]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.03D
      # Наименование детали.
      name: эксцентрик
      # Буква варианта детали (A, B, C…).
      variant: D
      # Угол шпоночного паза детали от эксцентриситета, °.
      key_angle: 135.0
      # Номера рядов, в которых применяется этот вариант.
      rows: [4]
      # ID детали для генератора чертежей.
    - id: PTK-010-R3X8-8M4P2-F11461.05A
      # Наименование детали.
      name: межрядная шайба
      # Буква варианта детали (A, B, C…).
      variant: A
      # Высота/толщина, мм.
      h: 1.0
      # Позиция детали по оси (0 — перед первым рядом).
      pos: [0, 1, 2, 3, 4]
      # Номера рядов, в которых применяется этот вариант.
      rows: [1, 2, 3, 4]
  # Снимок геометрии исполнения: из него считается хэш ID (Д-80), он же вход CAD.
  geom:
    # Ревизия расчётной геометрии: меняется при изменении формул (сбрасывает хэши ID).
    rev: 6.0
    # Число тел качения в ряду, шт.
    u: 10.0
    # Тип генератора волн: bearing | eccentric | magnet.
    gen: bearing
    # Тело качения из каталога (vendor_prices.yaml → rollers).
    roller:
      # Тип тела: roller (ролик) | ball (шарик).
      type: roller
      # Ø тела качения, мм.
      d: 3.0
      # Длина ролика, мм (у шарика равна d).
      l: 8.0
      # Переопределение a_ω для этого тела (null — из limits).
      a_w: null
      # Переопределение минимальной стенки для этого тела (null — из limits).
      wall_min: null
    # Подшипник генератора (d, D, B) при gen = bearing; иначе null.
    bearing:
      # Ø отверстия подшипника, мм.
      d: 10.0
      # Ø наружный, мм.
      D: 19.0
      # Ширина, мм.
      B: 5.0
    # Пределы шага 1, при которых получено исполнение (входят в хэш ID).
    limits:
      # Коэффициент a_k профиля (зазор/подрез).
      a_k: 0.2
      # Минимальный радиус вершины зуба, мм.
      r_tip_min: 0.05
      # Минимальная перемычка сепаратора, мм.
      sep_web_min: 1.0
      # Минимальный Ø входного вала, мм.
      shaft_d_min: 6.0
      # Минимальная стенка эксцентрика у паза шпонки, мм.
      ecc_wall_min: 1.0
      # Минимальная стенка деталей, мм.
      wall_min: 4.0
      # Осевой зазор между рядами, мм.
      row_gap: 1.0
      # Число рядов тел качения, шт.
      rows: 4.0
      # Заданные фазы рядов, ° (по умолчанию 0/90/180/270).
      row_phases: [0.0, 90.0, 180.0, 270.0]
      # Шаг округления d_bc, мм.
      d_bc_step: 0.1
      # Шаг округления d_out, мм.
      d_out_step: 1.0
      # Шаг округления Dgen, мм.
      dgen_step: 0.1
      # Зазор сепаратора, мм.
      sep_gap: 0.05
    # Отверстия крепления венца (Д-16).
    ring_holes:
      # Резьба крепёжных винтов (M4).
      bolt: M4
      # Число винтов, шт.
      n: 8.0
      # Число штифтов фиксации, шт.
      pins: 2.0
      # Ø штифтов, мм.
      pin_d: 4.0
      # Запас под головку винта, мм.
      head_margin: 0.5
    # Крепёж из таблицы fasteners (для d_bc и запаса под головку).
    fastener:
      # Ø отверстия под винт (с зазором), мм.
      d_clear: 4.5
      # Ø головки винта, мм.
      dk: 7.0
  # Итог: true — исполнение прошло проверки; false — причины в errors.
  ok: true
  # Отказы: исполнение не строится (габарит, стенка, прочность).
  errors: []
  # Предупреждения: построено, но есть замечания (оценки, границы).
  warnings: ["эксцентрик: остаток дисбаланса 4.87 из 4.9 г·мм — отверстия балансировки не помещаются (Д-46)", "ряд 3: стенка эксцентрика у паза шпонки 0.56 < ecc_wall_min 1 мм — изменить key_angle (Д-46)", "ряд 4: стенка эксцентрика у паза шпонки 0.56 < ecc_wall_min 1 мм — изменить key_angle (Д-46)"]
  # Технологические ограничения, влияющие на исполнение.
  tech: []
  # Причина исключения исполнения из выдачи (пусто — не исключено).
  excluded: ""
  # Сепаратор (.02): размеры и раскладка окон по рядам.
  sep:
    # Число окон, шт.
    n: 10
    # Внутренний радиус, мм.
    r_in: 10.34
    # Наружный радиус, мм.
    r_out: 11.66
    # Ширина окна, мм.
    w: 3.05
    # Высота окна, мм.
    h: 8.05
    # Осевая длина сепаратора, мм.
    length: 37.0
    # Перемычка между окнами, мм.
    web: 3.34
    # Ряды окон сепаратора.
    rows:
        # Номер ряда (1…N).
      - row: 1
        # Угловое положение окна в ряду, °.
        cage: 0.0
        # Начало ряда по оси от торца сепаратора, мм.
        z0: 0.975
        # Номер ряда (1…N).
      - row: 2
        # Угловое положение окна в ряду, °.
        cage: 18.0
        # Начало ряда по оси от торца сепаратора, мм.
        z0: 9.975
        # Номер ряда (1…N).
      - row: 3
        # Угловое положение окна в ряду, °.
        cage: 18.0
        # Начало ряда по оси от торца сепаратора, мм.
        z0: 18.975
        # Номер ряда (1…N).
      - row: 4
        # Угловое положение окна в ряду, °.
        cage: 0.0
        # Начало ряда по оси от торца сепаратора, мм.
        z0: 27.975
  # Эксцентрик (.03): размеры, дисбаланс, балансировка, ряды.
  ecc:
    # Наружный Ø эксцентрика, мм.
    De: 10.0
    # Толщина (длина по оси), мм.
    t: 5.0
    # Эксцентриситет (смещение оси), мм; стенка на тонкой стороне De/2 − a − d/2.
    a: 0.6000000000000001
    # Ø отверстия под входной вал, мм.
    d_shaft: 6.0
    # Ширина шпоночного паза, мм.
    key_b: 2.0
    # Глубина паза в эксцентрике t2, мм.
    key_t2: 1.0
    # Масса подшипника эксцентрика, г.
    m_brg_g: 2.8
    # true — масса подшипника взята оценкой.
    m_brg_est: true
    # Радиус канавки облегчения (null — нет).
    groove_r: null
    # Дисбалансы эксцентрика, г·мм.
    U:
      # Дисбаланс диска, г·мм.
      disk: 1.85
      # Дисбаланс подшипника, г·мм.
      brg: 1.69
      # Дисбаланс тел качения, г·мм.
      bodies: 1.33
      # Суммарный дисбаланс до балансировки, г·мм.
      sum: 4.87
    # Балансировка: отверстия и остаточный дисбаланс.
    bal:
      # Число отверстий балансировки, шт (0 — не помещаются).
      n: 0
      # Ø отверстия балансировки, мм.
      d: 0.0
      # Радиус окружности отверстий, мм.
      r: 0.0
      # Дисбаланс, снимаемый отверстиями, г·мм.
      U_rem: 0.0
      # Остаточный дисбаланс, г·мм.
      res: 4.87
      # Координаты отверстий балансировки (x, y), мм.
      holes: []
    # Ряды эксцентриков (пакет).
    rows:
        # Номер ряда (1…N).
      - row: 1
        # Угол поворота ряда относительно ряда 1, °.
        phi: 0.0
        # Угол шпоночного паза этого ряда от эксцентриситета, °.
        key_angle: 45.0
        # Стенка под шпоночным пазом, мм.
        key_wall: 1.41
        # Номер ряда (1…N).
      - row: 2
        # Угол поворота ряда относительно ряда 1, °.
        phi: 90.0
        # Угол шпоночного паза этого ряда от эксцентриситета, °.
        key_angle: 315.0
        # Стенка под шпоночным пазом, мм.
        key_wall: 1.41
        # Номер ряда (1…N).
      - row: 3
        # Угол поворота ряда относительно ряда 1, °.
        phi: 180.0
