# Полуфабрикаты по маркам — заполняет заказчик (Д-56, Д-67). Формат — YAML (Д-79).
# У каждой марки свой сортамент: формы и размеры задаются внутри materials.<марка>.
# Ключ марки — из specs/materials.yaml. Размеры — пример, проверить наличие.
# Ориентир: трубы ГОСТ 8734 / EN 10305 (холоднодеф.), ГОСТ 8732 (горячедеф.);
# листы ГОСТ 19904; пруток ГОСТ 2590.
# Заготовка .02 подбирается на шаге 2 (ptk_layout.blanks): марки — по порядку
# products.yaml → PTK.parts."02".material; берётся первая с подходящей формой,
# остальные подходящие — «также» в SPEC-11.
# Запрос поставщикам (CP-85): трубы 73×5, 70×7, 73×18 в 30ХГСА и 40Х (у 40Х 73×18 в списке нет),
# пруток 40Х Ø50–75 (.12, .13, .14); х/д 35ХМ 70…72×4 (CP-86). До ответа размеры — примеры.
# Не искать (TECH-01, CP-86): 15ХФ, лист 25ХГТ, г/д 40ХМФА, трубы Ø76+ для L3/L4 PTK-050.
# Крупные диаметры (CP-117, rev15.1, проверено 2026-11-23). Сортамент ГОСТ 8732-78 кончается
# рядом Ø245 — Ø250 в нём нет (следующий 273), поэтому «до 250» = до 245. Стенка для каждого Ø
# доступна не любая: ряды 180…245 добавлены по сортаменту, при заказе стенку подтверждать.
# Поставщики (наличие по сайтам, цены/склад не проверялись):
#   40Х труба 245×24 — trub-prom.com (склад 4.47 т), 40Х 199–219 — lionmetals74.ru, bz66.ru;
#   40ХН2МА — nickel-steel.ru (ф48–610), metalweb.ru (219, 273, 377…), chelmetgroup.ru,
#     pulscen (133×25, МеталлКор), specmetall.su (Ø234); под заказ — inoks.ru, trubanasklade.ru;
#   38Х2МЮА круг Ø250 — metiz-online.ru (250, 2ГП), specmetall.su (250), gkfenix.ru (250),
#     mc.ru, a-metall.com, steel-ex.ru (250 и 260), td-uzm.ru — то есть пруток до 250 есть;
#   ШХ15 круг до Ø250 — tduralprokat.ru (250, ШХ15-В), mpe-barnaul (250), yaruse.ru (10–300),
#     metallsnab-nn.ru (200), starteks (3–250);
#   ШХ15 труба — только ГОСТ 800-78: г/д Ø70–204 (D/s = 4–17, внутр. ≥ 48), х/д Ø20–90;
#     в продаже до Ø219 (group-m5.com), uralpipe.ru (10–200, ±0.05 мм) — Ø250 подшипниковых труб нет.
# ШХ15 в расчёте сепаратора не участвует (марки .02 — materials.yaml), но нужен для венца .01/.18:
# трубы подшипниковые берут на кольца, пруток — на мелкие венцы и обод.

# Припуск на сторону: труба / лист, мм.
tube_allow: 0.5
sheet_allow: 0.3
# Допуски труб (доли), Д-72: ГОСТ 8732 обычной точности — D ±0.8 %, стенка −15 %; для 8734 — с запасом.
tube_tol_D: 0.008
tube_tol_s: 0.15

