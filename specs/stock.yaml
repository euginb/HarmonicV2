# Полуфабрикаты — заполняет заказчик (Д-56). Формат — YAML (Д-60).
# Ориентир: трубы ГОСТ 8734 / EN 10305, листы ГОСТ 19904, пруток ГОСТ 2590.
# Размеры — пример, проверить наличие. *_allow — припуск на сторону, мм.
# Заготовка .02 подбирается на шаге 2 (ptk_layout, таблица «Оснастка» SPEC-11).

# Припуск на сторону: труба / лист, мм.
tube_allow: 0.5
sheet_allow: 0.3

# Трубы: D — наружный Ø, s — стенка, мм; note — источник/примечание.
tubes:
  - {D: 70.0, s: 2.5, note: "ГОСТ 8734, пример"}
  - {D: 70.0, s: 3.0, note: "ГОСТ 8734, пример"}
  - {D: 76.0, s: 3.0, note: "ГОСТ 8734, пример"}

# Листы — толщины в наличии, мм.
sheets: [0.8, 1.0, 1.2, 1.5, 2.0]

# Пруток — Ø в наличии, мм.
bars: [70.0, 75.0, 80.0, 90.0]
