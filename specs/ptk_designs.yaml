      # Высота шпонки h, мм.
      h: 5
      # Глубина паза вала t1, мм.
      t1: 3.0
      # Глубина паза ступицы t2, мм.
      t2: 2.3
      # Верхняя граница Ø вала для шпонки, мм.
    - d_max: 22
      # Ширина шпонки b, мм.
      b: 6
      # Высота шпонки h, мм.
      h: 6
      # Глубина паза вала t1, мм.
      t1: 3.5
      # Глубина паза ступицы t2, мм.
      t2: 2.8
      # Верхняя граница Ø вала для шпонки, мм.
    - d_max: 30
      # Ширина шпонки b, мм.
      b: 8
      # Высота шпонки h, мм.
      h: 7
      # Глубина паза вала t1, мм.
      t1: 4.0
      # Глубина паза ступицы t2, мм.
      t2: 3.3
      # Верхняя граница Ø вала для шпонки, мм.
    - d_max: 38
      # Ширина шпонки b, мм.
      b: 10
      # Высота шпонки h, мм.
      h: 8
      # Глубина паза вала t1, мм.
      t1: 5.0
      # Глубина паза ступицы t2, мм.
      t2: 3.3
      # Верхняя граница Ø вала для шпонки, мм.
    - d_max: 44
      # Ширина шпонки b, мм.
      b: 12
      # Высота шпонки h, мм.
      h: 8
      # Глубина паза вала t1, мм.
      t1: 5.0
      # Глубина паза ступицы t2, мм.
      t2: 3.3
  # Расчёт входного вала: Ø, напряжения, момент на эксцентрике.
  shaft:
    # Принятый Ø вала, мм.
    d: 10.0
    # Ø отверстия полого вала, мм; 0 — сплошной.
    bore: 0.0
    # Тип соединения эксцентрик–вал: key | flat | integral | spline | press.
    link: key
    # КПД передачи, принятый в расчёте.
    eta: 0.8
    # Доля входного момента на один эксцентрик.
    ecc_share: 0.5
    # Момент на валу, Н·мм.
    M: 108.0
    # Момент на входе (с учётом КПД), Н·мм.
    T_in: 2.7
    # Момент на одном эксцентрике, Н·мм.
    T_e: 1.35
    # τ кручения вала, МПа.
    tau: 24.9
    # [τ] кручения вала, МПа.
    tau_allow: 25.0
    # Требуемый по кручению Ø вала, мм.
    d_req: 9.99
  # Соединение эксцентрик–вал: тип, напряжения, размеры шпонки.
  link:
    # Тип соединения: key | flat | integral | spline | press.
    type: key
    # σсм соединения, МПа.
    sigma: 56.2
    # Ширина шпонки b, мм.
    b: 3
    # Высота шпонки h, мм.
    h: 3
    # Глубина паза вала t1, мм.
    t1: 1.8
    # Глубина паза в эксцентрике t2, мм.
    t2: 1.4
    # Длина шпонки/соединения, мм.
    lp: 4.0
    # [σсм] соединения, МПа.
    sigma_allow: 100.0
  # Эксцентрик .03: размеры, дисбаланс, балансировка, ряды.
  ecc:
    # Наружный Ø эксцентрика, мм.
    De: 50.0
    # Толщина (длина по оси) эксцентрика, мм.
    t: 7.0
    # Эксцентриситет (смещение оси эксцентрика от оси вала), мм; стенка на тонкой стороне = De/2 − a − d/2.
    a: 0.4
    # Ø отверстия под вал, мм.
    d_shaft: 10.0
    # Ширина шпоночного паза, мм.
    key_b: 3
    # Глубина паза в эксцентрике t2, мм.
    key_t2: 1.4
    # Масса подшипника эксцентрика, г.
    m_brg_g: 26.1
    # true — масса подшипника взята оценкой.
    m_brg_est: true
    # Радиус канавки облегчения (null — нет).
    groove_r: null
    # Дисбалансы эксцентрика, г·мм.
    U:
      # Дисбаланс диска, г·мм.
      disk: 43.16
      # Дисбаланс подшипника, г·мм.
      brg: 10.42
      # Дисбаланс тел качения, г·мм.
      bodies: 1.04
      # Суммарный дисбаланс до балансировки, г·мм.
      sum: 54.62
    # Балансировка: число и Ø отверстий, остаточный дисбаланс.
    bal:
      # Число отверстий балансировки, шт.
      n: 2
      # Ø отверстия балансировки, мм.
      d: 5.5
      # Радиус окружности отверстий, мм.
      r: 21.64
      # Дисбаланс, снимаемый отверстиями, г·мм.
      U_rem: 55.86
      # Остаточный дисбаланс, г·мм.
      res: -1.25
      # Углы отверстий балансировки, °.
      holes:
        - [21.395, -3.25]
        - [21.395, 3.25]
    # Ряды эксцентриков (пакет): углы и стенки под шпонку.
    rows:
        # Номер ряда (1…N).
      - row: 1
        # Угол поворота ряда относительно ряда 1, °.
        phi: 0.0
        # Угол паза этого ряда от эксцентриситета, °.
        key_angle: 45.0
        # Стенка под шпоночным пазом, мм.
        key_wall: 18.88
        # Номер ряда (1…N).
      - row: 2
        # Угол поворота ряда относительно ряда 1, °.
        phi: 90.0
        # Угол паза этого ряда от эксцентриситета, °.
        key_angle: 315.0
        # Стенка под шпоночным пазом, мм.
        key_wall: 18.88
        # Номер ряда (1…N).
      - row: 3
        # Угол поворота ряда относительно ряда 1, °.
        phi: 180.0
        # Угол паза этого ряда от эксцентриситета, °.
        key_angle: 225.0
        # Стенка под шпоночным пазом, мм.
        key_wall: 18.32
        # Номер ряда (1…N).
      - row: 4
        # Угол поворота ряда относительно ряда 1, °.
        phi: 270.0
        # Угол паза этого ряда от эксцентриситета, °.
        key_angle: 135.0
        # Стенка под шпоночным пазом, мм.
        key_wall: 18.32
  # Массово-инерционные характеристики пакета.
  mass:
    # Масса эксцентриков, г.
    ecc_g: 101.0
    # Масса подшипников эксцентриков, г.
    brg_g: 26.1
    # Масса входного вала, г.
    shaft_g: 20.3
    # Суммарная масса, г.
    sum_g: 528.6
    # Момент инерции входа, г·мм².
    J_in: 0.0002178
    # Момент инерции выхода, г·мм².
    J_out: 0.5446
