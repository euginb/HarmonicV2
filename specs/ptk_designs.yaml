        ext:
          std: ГОСТ 13942-86
        # Канавка ГОСТ 13943-86 (rings_int) в корпусе крышки .07B: внутренняя фиксация наружного кольца .09 от осевого смещения внутрь. Ключ подбора — Ø наружный D подшипника .09.
