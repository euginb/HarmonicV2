# ============================================================================
# ptk_designs.yaml — проработки шага 2 «Проработка выбранных исполнений».
# Пишет МАШИНА: python main.py design --publish → specs/ptk_designs.yaml
#
# Руками НЕ править: изменения теряются на следующем прогоне. Управляющие
# параметры проработок (eta, ecc_share, key_angle, shaft, balance, output,
# layout, join, supports) задаются в specs/ptk_design_input.yaml — там же
# описан каждый входной ключ.
#
# Формат YAML заменяет прежний ptk_designs.json (Д-105): каждый ключ вывода
# снабжён комментарием, шапка содержит глоссарий сокращений. Ключи-номера
# позиций ("09") выводятся строкой в кавычках — иначе YAML 1.1 читает 010
# как 8, а 09 как строку, и тип ключа зависел бы от номера позиции.
#
# СОКРАЩЕНИЯ
#   .NN         позиция спецификации: .01 корпус, .02 обечайка/стакан (.02A
#               стакан L1, .02B обечайка с буртом L2, .02C обечайка без бурта
#               L3/L4), .03 эксцентрик, .04/.05 гильза и втулка, .07A/.07B
#               крышки входа/выхода, .09 подшипник выхода, .10 подшипник конца
#               входного вала, .11 кольцо дистанционное, .12 ступица (.12A
#               с опорным ободом L2/L4, .12B дно-вставка L3), .13 дно-лист
#               (CANCELLED), .14 кольцо-бурт L4, .15 входной вал, .16 гайка.
#   L1…L4       конструктив выхода (Д-73, Д-96, Д-102).
#   D, d        наружный / внутренний диаметр, мм; r0, r1 — внутренний /
#               наружный радиус, мм (r = D/2).
#   t, s        толщина: t — стенка/диск, s — толщина детали или стенка трубы.
#   m           ширина канавки по оси, мм (ГОСТ 13942/13943).
#   L, l        L — длина по оси (детали, соединения, кольца); l — длина штифта.
#   n, n_p      число элементов, шт (n_p — штифты фланца).
#   F, M, U     сила (Н), момент (Н·мм), дисбаланс (г·мм).
#   eta         КПД передачи; ecc_share — доля момента на один эксцентрик.
#   tau         касательное напряжение τ, МПа; sig_* — напряжение смятия σсм,
#               МПа; [τ], [σ] — допускаемые (в ключах — tau_allow, sig_allow).
#   hole12      глубина гнезда штифта в ступице .12, мм (Д-74).
#   need        требуемая (минимальная) величина; lim — предел/допуск.
#   b09, b10    подшипники .09 и .10 (строки vendor_prices.yaml → bearings).
#   da          диаметр заплечика подшипника (каталог); r_h = da/2.
#   s_об        толщина опорного обода .12A: s_об = r0 − r_h (Д-102 п. 4).
#   grooves     канавки под стопорные кольца ГОСТ 13942 (наружное, на ступице/вале)
#               и 13943 (внутреннее, в отверстии .07B); ключи ext (наружное,
#               rings_ext) и int (внутреннее, rings_int); параметры s (толщина
#               кольца), m (ширина канавки), d2 (Ø дна канавки).
# ============================================================================

  # ID записи: ID исполнения шага 1 + «-» + имя проработки (префикс без хэша, Д-51).
- id: PTK-050-R2X4_2-8M4P2-06A797
  # Имя проработки (K8, K10…): суффикс файлов деталей и сборки; латиница, цифры, «_», без «-».
  name: K8
  # Итог: true — конструктив выбран и проверки пройдены; false — причины в errors, запись неполная.
  ok: false
  # Отказы: проработка не строится (нет заготовки, не проходят штифты, нет конструктива).
  errors: ["вал Ø8: τ = 43.7 > [τ] = 25 МПа — нужен d ≥ 9.4 мм"]
  # Предупреждения: построено, но есть замечания (оценки, подстановки, границы).
  warnings: [нагрузки опор .09/.10 по C0 не проверяются (OQ-17), "конструктив L3 выбран из L4, L3, L2: L4 — L4: L2/L4 вырождаются в L3 — опорный обод .12A толщина 6.56 < 7.62 (гнездо 6.62 + pin_wall 1): отв. кольца .14 r0 30.06, заплечик .09 r_h 23.50; деление на детали не имеет смысла (Д-102 п. 4)"]
  # Эхо входа: дословная копия записи designs[] из specs/ptk_design_input.yaml — для воспроизводимости.
  input:
    # ID исполнения шага 1, к которому относится проработка.
    id: PTK-050-R2X4_2-8M4P2
    # Подшипник выхода .09, заданный во входе (уточняет выбор при неоднозначном префиксе ID).
    bearing: "61810"
    # Имя проработки из входа.
    name: K8
    # КПД передачи: T_вх = M/(u·eta); меньше eta — больше момент на валу и эксцентриках.
    eta: 0.8
    # Доля входного момента на один эксцентрик (смятие шпонки, OQ-15).
    ecc_share: 0.5
    # Угол паза шпоночного ряда 1 от направления эксцентриситета, °; ряд k — минус φk.
    key_angle: 45.0
    # Входной вал в эксцентрике: расчётные параметры вала и шпоночного соединения.
    shaft:
      # Ø вала, мм (кручение, шпонка, стенка эксцентрика).
      d: 8.0
      # Ø отверстия полого вала, мм; 0 — сплошной.
      bore: 0.0
      # Соединение эксцентрик–вал: key | flat | integral | spline | press.
      link: key
      # [τ] кручения вала, МПа (изгиб не считается — занижено).
      tau_allow: 25.0
      # [σсм] шпонки вала, МПа.
      sigma_crush: 100.0
      # Минимальная стенка полого вала у паза, мм.
      wall_min: 1.5
    # Балансировка пакета эксцентриков на шаге 2.
    balance:
      # Наибольшее число отверстий балансировки, шт.
      n_max: 3
      # Стенка у отверстий балансировки, мм.
      wall: 1.0
      # Имеющиеся свёрла, мм (пусто — от bal_d_min с шагом bal_d_step шага 1).
      drills: [3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0]
    # Облегчение ступицы: none — не используется (OQ-12).
    lighten: none
    # Выходной вал в ступице (Д-102, CP-90): формат как shaft, шпонки — keys.table.
    output:
      # Соединение ступица–потребитель: key | spline (flange — до реализации отказ).
      link: key
      # Ø выходного вала, мм; 0 — подбор по кручению.
      d: 0.0
      # [τ] кручения выходного вала, МПа (изгиб от потребителя не считается).
      tau_allow: 25.0
      # [σсм] шпонки в стальной ступице, МПа.
      sigma_crush: 130.0
    # Список конструктивов в порядке предпочтения: берётся первый, для которого есть заготовка и проходят штифты.
    layout: [L4, L3, L2]
  # Результат выбора конструктива и расчёт всей геометрии узла (вход генератора CAD).
  layout:
    # Выбранный конструктив: L1 | L2 | L3 | L4.
    code: L3
    # Наименование конструктива по products.yaml (для таблицы «Конструктив» SPEC-11).
    name: обечайка без бурта + дно-вставка
    # Позиции спецификации: ключ — номер позиции (строка!), значение — обозначение детали с буквой исполнения.
    parts:
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "01": ring_phase
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "02": plain
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "03": row
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "04": body
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "05": thick
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "07": side
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "08": gen
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "09": out
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "10": in
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "11": ring
      # Позиция спецификации .NN: обозначение детали с буквой исполнения (ключ — строка «09», не число).
      "12": insert
    # Подшипник выхода .09 — строка каталога vendor_prices.yaml → bearings.
    b09:
      # Обозначение подшипника (61810).
      id: "61809"
      # Ø отверстия d, мм (посадка на ступицу).
      d: 45.0
      # Ø наружный D, мм (посадка в .07B).
      D: 58.0
      # Ширина B, мм.
      B: 7.0
      # Грузоподъёмность динамическая C, кН.
      C: 6.63
      # Грузоподъёмность статическая C0, кН.
      C0: 6.1
      # Ø заплечика da, мм — упор внутреннего кольца на ступице; r_h = da/2 (OQ-31).
      da: 47.0
    # Подшипник конца входного вала .10 — гнездо в ступице.
    b10:
      # Обозначение подшипника (61800).
      id: "61800"
      # Ø отверстия d, мм (посадка на входной вал).
      d: 10.0
      # Ø наружный D, мм (гнездо в ступице).
      D: 19.0
      # Ширина B, мм.
      B: 5.0
      # Грузоподъёмность динамическая C, кН.
      C: 1.72
      # Грузоподъёмность статическая C0, кН.
      C0: 0.83
      # Ø заплечика da, мм.
      da: 12.0
    # τ кручения ступицы, МПа.
    tau_hub: 9.0
    # [τ] кручения ступицы, МПа.
    tau_allow: 25.0
    # Кольцо дистанционное .11 (между подшипниками и эксцентриками).
    r11:
      # Число колец .11, шт.
      n: 3
      # Толщина кольца, мм.
      h: 1.0
      # Внутренний Ø, мм.
      d_in: 8.0
      # Наружный Ø, мм.
      d_out: 12.0
    # Крышки .07A/.07B: привалочные размеры.
    covers:
      # Толщина крышки входа .07A, мм.
      tA: 6.0
      # Толщина крышки выхода .07B, мм (по канавке ГОСТ 13943 лип_B).
      tB: 23.0
      # Ø посадки крышки в корпус, мм.
      D: 95.0
      # Глубина гнезда .07A, мм.
      seat_A: 19.0
      # Глубина гнезда .07B, мм.
      seat_B: 58.0
      # Карман крышки: [Ø кармана, глубина], мм.
      pocket: [68.88, 15.0]
    # Стакан/обечайка .02 — осевые размеры и ступица (Д-102, Д-103).
    cup:
      # Начало внутренней полости в системе корпуса, мм (z = 0 сборки).
      z_in: 36.5
      # Толщина дна стакана, мм (L1) либо длина обечайки до торца (L3/L4).
      t: 11.0
      # Ø ступицы (посадка .09), мм.
      hub_d: 45.0
      # Ø отверстия под .10, мм.
      hub_bore: 19.0
      # Длина ступицы, мм.
      hub_l: 34.5
    # Габаритная длина проработки по оси, мм (CP-45).
    length: 88.0
    # Заготовка .02: выбранный материал, альтернативы и требования к сортаменту.
    blank:
      # Материал заготовки .02.
      material: 40Х
      # Материалы, перебранные как альтернатива.
      alt: [40ХН2МА, 30ХГСА, 35ХМ]
      # Материалы, для которых искали заготовку.
      tried: [38Х2МЮА, 40Х, 40ХН2МА, 20ХН3А, 30ХГСА, "40", 35ХМ, 30Х3МФ]
      # Заготовки по альтернативным материалам (нужны для сравнения съёма металла).
      alt_fit:
        "40ХН2МА":
            # Ø трубы альтернативного материала, мм.
          - D: 73.0
            # Стенка трубы альтернативного материала, мм.
            s: 14.0
            # Примечание по заготовке альтернативного материала.
            note: "ГОСТ 8732, горячедеф."
          - null
          - null
        "30ХГСА":
            # Ø трубы альтернативного материала, мм.
          - D: 70.0
            # Стенка трубы альтернативного материала, мм.
            s: 7.0
            # Примечание по заготовке альтернативного материала.
            note: "ГОСТ 8732-78, горячедеф."
          - 1.5
          - null
        "35ХМ":
            # Ø трубы альтернативного материала, мм.
          - D: 70.0
            # Стенка трубы альтернативного материала, мм.
            s: 4.0
            # Примечание по заготовке альтернативного материала.
            note: "ГОСТ 8734-75, холоднодеф"
          - null
          - null
      # Чего не хватило в сортаменте (причина отказа материала).
      missing: [38Х2МЮА, 20ХН3А, "40", 30Х3МФ]
      # Допустимые формы заготовки: труба | лист | пруток.
      forms: [tubes, sheets]
      # Выбранная труба заготовки .02.
      tube:
        # Наружный Ø трубы, мм.
        D: 73.0
        # Стенка трубы, мм.
        s: 5.0
        # Примечание по трубе (допуск, источник).
        note: ГОСТ 8732-78
      # Требуемые [Ø_min, Ø_max] или [D, s] трубы, мм.
      tube_need: [68.88, 65.12]
      # Лист-заготовка (для конструктива с дном-листом; ветка CANCELLED).
      sheet: null
      # Требуемая толщина листа, мм.
      sheet_need: 1.48
      # Требуемый размер листа, мм.
      sheet_len: 210.5
      # Пруток-заготовка, мм (L1 — стакан монолитом).
      bar: null
    # Соединение .02–.12 (Д-74): выбранный вариант, перебор и пределы расчёта.
    join:
      # Выбранный вариант соединения (вход CAD и ячейка «Схема» SPEC-11).
      pick:
        # Схема: collar (L2, бурт .02B) | insert (L3, дно-вставка .12B) | ring (L4, кольцо .14).
        scheme: insert
        # Материал заготовки .02 в выбранном варианте.
        material: 40Х
        # Труба заготовки .02 выбранного варианта.
        tube:
          # Наружный Ø трубы, мм.
          D: 73.0
          # Стенка трубы, мм.
          s: 5.0
          # Примечание по трубе.
          note: ГОСТ 8732-78
        # Штифты соединения и проверки прочности (срез, смятие стенки и ступицы, срез к торцу).
        pins:
          # Ø штифта, мм (ГОСТ 24296-93, m6).
          d: 3.0
          # Число штифтов, шт (делитель числа окон сепаратора).
          n: 10
          # Сила на штифт, Н.
          F: 3266.8
          # τ среза штифта, МПа.
          tau: 46.2
          # σсм стенки .02, МПа.
          sig_wall: 123.7
          # σсм ступицы/обода .12, МПа.
          sig_hub: 24.2
          # τ среза к торцу, МПа.
          tau_edge: 61.9
          # Длина соединения / пояса по оси, мм.
          L: 9.0
          # Шаг штифтов по окружности, мм.
          pitch: 20.8
          # Толщина стенки под штифтом, мм.
          t: 0.88
          # Требуемая длина штифта (стенка + pin_depth_k·d), мм.
          need: 5.38
          # Длина штифта по ГОСТ 24296-93, мм.
          l: 8.0
          # Обозначение штифта («Штифт 3×8 ГОСТ 24296-93»).
          des: Штифт 3×8 ГОСТ 24296-93
          # Ключ vendor_prices.yaml → pins (P3x8).
          key: P3x8
          # Глубина гнезда в ступице/ободе .12: l − t + pin_gap, мм (Д-74).
          hole12: 7.62
        # Геометрия схемы соединения: радиусы, стенка, Ø пояса и отверстия.
        geom:
          # Радиус осей штифтов, мм (для схемы «обод в отверстии» — не используется).
          r_j: 33.06
          # Стенка, через которую проходит штифт, мм.
          t: 0.88
          # Наружный Ø пояса/бурта, мм.
          D: 67.88
          # Внутренний Ø пояса/бурта, мм.
          d: 66.12
      # Все перебранные схемы соединения с причинами отказа (для SPEC-11 и разбора).
      variants:
          # Схема варианта: collar | insert | ring.
        - scheme: insert
          # Геометрия варианта.
          geom:
            # Радиус осей штифтов, мм.
            r_j: 33.06
            # Толщина (стенка), мм.
            t: 0.88
            # Наружный диаметр, мм.
            D: 67.88
            # Диаметр посадки/отверстия, мм.
            d: 66.12
          # Штифты и проверки прочности варианта (null — штифты не подобраны).
          pins:
            # Ø штифта, мм (ГОСТ 24296-93, m6).
            d: 3.0
            # Число штифтов, шт (делитель числа окон сепаратора).
            n: 10
            # Сила на штифт, Н.
            F: 3266.8
            # τ среза штифта, МПа.
            tau: 46.2
            # σсм стенки .02, МПа.
            sig_wall: 123.7
            # σсм ступицы/обода .12, МПа.
            sig_hub: 24.2
            # τ среза к торцу, МПа.
            tau_edge: 61.9
            # Длина соединения / пояса по оси, мм.
            L: 9.0
            # Шаг штифтов по окружности, мм.
            pitch: 20.8
            # Толщина стенки под штифтом, мм.
            t: 0.88
            # Требуемая длина штифта (стенка + pin_depth_k·d), мм.
            need: 5.38
            # Длина штифта по ГОСТ 24296-93, мм.
            l: 8.0
            # Обозначение штифта («Штифт 3×8 ГОСТ 24296-93»).
            des: Штифт 3×8 ГОСТ 24296-93
            # Ключ vendor_prices.yaml → pins (P3x8).
            key: P3x8
            # Глубина гнезда в ступице/ободе .12: l − t + pin_gap, мм (Д-74).
            hole12: 7.62
          # Требуемые размеры заготовки, мм.
          need: [68.88, 65.12]
          # Подходящие трубы по материалам варианта.
          fit:
            "40Х":
              # Наружный диаметр, мм.
              D: 73.0
              # Толщина стенки/детали, мм.
              s: 5.0
              # Примечание.
              note: ГОСТ 8732-78
            "40ХН2МА":
              # Наружный диаметр, мм.
              D: 76.0
              # Толщина стенки/детали, мм.
              s: 10.0
              # Примечание.
              note: "ГОСТ 8732, горячедеф."
            "30ХГСА":
              # Наружный диаметр, мм.
              D: 73.0
