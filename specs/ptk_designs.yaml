          # true — схема «опорный обод .12A в отверстии бурта/кольца» (Д-102 п. 2).
          seat: true
          # Осевые штифты (в seat-схеме false — их нет).
          axial: false
          # Радиус опорного обода = радиус отверстия бурта/кольца, мм.
          r_seat: 30.06
          # Кольцо-бурт .14 для CAD (L4).
          ring:
            # Радиус отверстия кольца, мм.
            r0: 30.06
            # Наружный радиус кольца, мм.
            r1: 33.06
            # Длина кольца, мм.
            L: 9.0
            # Ширина кольца, мм.
            w: 3.0
          # Посадка опорного обода (seat_fit), например H7/js6.
          fit: H7/js6
  # Таблица шпонок призматических (DIN 6885 / ГОСТ 23360): первая строка с d ≤ d_max.
  keys:
      # Верхняя граница Ø вала для шпонки, мм.
    - d_max: 8
