# ============================================================================
# catalog_hiwin_hg.yaml — каталог линейных подшипников HIWIN серии HG (CAT-01).
# Пишет МАШИНА: python main.py catalog (или --publish) → specs/catalog_hiwin_hg.yaml
#
# Руками НЕ править: источник — configs/catalog_hiwin_hg.md (текст каталога G99TE17-1306),
# разбор — egm/catalog.py. Правка каталога делается в .md, затем прогон.
#
# Формат — комментированный YAML (Д-106). Парная таблица «каталожный номер → каретка
# + рельс» лежит рядом в catalog_hiwin_hg_pairs.yaml (машинный вид, без комментариев).
#
# ОБОЗНАЧЕНИЯ HIWIN (серия HG)
#   HGH..CA / HGH..HA   тип каретки: CA — обычная, HA — увеличенной грузоподъёмности.
#   HGR..R / HGR..H     тип рельса: R — стандартный, H — с креплением сверху.
#   H, H1   высота каретки от опорной плоскости / до плоскости рельса, мм.
#   N, W    ширина каретки / ширина с учётом плеч, мм.
#   B, B1   расстояние между крепёжными отверстиями / до края, мм.
#   C, L1, L  длина корпуса / до торца / общая с концевыми уплотнениями, мм.
#   K1, K2  высота плеча / вылет, мм.
#   G, M, T резьба пресс-маслёнки, резьба крепежа, высота, мм.
#   WR, HR  ширина и высота рельса, мм.
#   D, h, d, P, E  Ø отверстия рельса, глубина, зенковка, шаг и краевой размер, мм.
#   C, C0   грузоподъёмность динамическая и статическая, кН.
#   MR, MP, MY  моменты: крен, тангаж, рыскание, кН·м.
#   Z0/ZA/ZB  классы натяга (преднатяг); C/H/P/SP/UP — классы точности.
#   Es, P   краевой размер и шаг отверстий рельса, мм; max_len — максимальная длина, мм.
#
# Каталог задаёт часть символов ТОЛЬКО чертежом — текстового определения в PDF нет
# (docs/HG-Series-Catalog_opt.md, «Условные обозначения размеров»). Для таких ключей
# комментарий даёт групповое имя каталога (Dimensions of Assembly / Block / Rail) и пометку
# «только чертежом»; там, где определение в каталоге есть, оно приведено в оригинале
# (Clearance under block, Basic Dynamic Load Rating, Static Rated Moment, threaded hole).
# ============================================================================

