# Формат — YAML (Д-79). Тела и подшипники — instructions/INS-10_PTK_CALC.md,
# направляющие и цены — instructions/INS-20_CATALOG.md.

currency: RUB

# Наличие, цена, сроки: ключ — обозначение позиции; null — не заполнено.
