  "61806": {d: 30.0, D: 42.0, B: 7.0, C: 4.49, C0: 2.9}
  "61807": {d: 35.0, D: 47.0, B: 7.0, C: 4.75, C0: 3.2}
  "61808": {d: 40.0, D: 52.0, B: 7.0, C: 4.94, C0: 3.45}
  "61809": {d: 45.0, D: 58.0, B: 7.0, C: 6.63, C0: 6.1}
  "61810": {d: 50.0, D: 65.0, B: 7.0, C: 6.76, C0: 6.8}
  "61811": {d: 55.0, D: 72.0, B: 9.0, C: 9.04, C0: 8.8}
  "61812": {d: 60.0, D: 78.0, B: 10.0, C: 11.9, C0: 11.4}
  "61813": {d: 65.0, D: 85.0, B: 10.0, C: 12.1, C0: 12.5}
