        gen_types: [rim]
    63:
      300:
        mounts: [M6x24P2, M5x12P2]
        rollers: [R_D3x8, R_D4x12]
        # ─── Перебор под M_req: значения по умолчанию для всех вариантов u_calc ────────
        # Шаг подъёма RΣ, мм, и наибольший подъём над RΣ min, мм (время прогона ∝ r_up_max/r_step
        # на крепление и на высоту пояса). Вариант u_calc[u][M_req] может их переопределить.
        r_step: 1.0
        r_up_max: 40.0
        # Высоты пояса сепаратора hb, мм (CP-95b): добавка к шагу ряда при переборе под M_req.
        # 0 — пояс как вышел (зазор ряда минус sep_gap). Больше высот — дольше прогон.
        band_h_list: [0, 2, 4, 6, 8]

        # Типы генератора (Д-42): bearing — тела на наружном кольце подшипника;
        # eccentric — тела прямо по эксцентрику (жёлоб groove_f). Каждая пара (u, тело)
        # считается для каждого типа; тип входит в хэш ID и в колонку «Генератор».
        # rim (CP-96) — малый подшипник на эксцентрике + обод .18, тела катятся по ободу.
        gen_types: [rim]
      400:
        mounts: [M6x24P2, M5x12P2]
        rollers: [R_D3x8, R_D4x12]
        # ─── Перебор под M_req: значения по умолчанию для всех вариантов u_calc ────────
        # Шаг подъёма RΣ, мм, и наибольший подъём над RΣ min, мм (время прогона ∝ r_up_max/r_step
        # на крепление и на высоту пояса). Вариант u_calc[u][M_req] может их переопределить.
        r_step: 1.0
        r_up_max: 40.0
        # Высоты пояса сепаратора hb, мм (CP-95b): добавка к шагу ряда при переборе под M_req.
        # 0 — пояс как вышел (зазор ряда минус sep_gap). Больше высот — дольше прогон.
        band_h_list: [0, 2, 4, 6, 8]

        # Типы генератора (Д-42): bearing — тела на наружном кольце подшипника;
        # eccentric — тела прямо по эксцентрику (жёлоб groove_f). Каждая пара (u, тело)
        # считается для каждого типа; тип входит в хэш ID и в колонку «Генератор».
        # rim (CP-96) — малый подшипник на эксцентрике + обод .18, тела катятся по ободу.
        gen_types: [rim]
  # Типы генератора (Д-42): bearing — тела на наружном кольце подшипника;
  # eccentric — тела прямо по эксцентрику (жёлоб groove_f). Каждая пара (u, тело)
  # считается для каждого типа; тип входит в хэш ID и в колонку «Генератор».
  # rim (CP-96) — малый подшипник на эксцентрике + обод .18, тела катятся по ободу.
  gen_types: [bearing, rim]

  # ─── Перебор под M_req: значения по умолчанию для всех вариантов u_calc ────────
  # Шаг подъёма RΣ, мм, и наибольший подъём над RΣ min, мм (время прогона ∝ r_up_max/r_step
  # на крепление и на высоту пояса). Вариант u_calc[u][M_req] может их переопределить.
  r_step: 1.0
  r_up_max: 40.0

  # aω / Dш, если у тела не задан свой a_w (Д-38: 0.2). Больше — глубже волна (4aω)
  # и больше α max (≈ arctg √(2aω/Dш)), но RΣ по подрезу и D растут.
  a_k: 0.2

  # Наименьший радиус кривизны профиля на вершине волны, мм (подрез) —
  # задаёт RΣ min при больших u.
  r_tip_min: 0.05

  # Наименьшая перемычка сепаратора между гнёздами, мм — задаёт RΣ min при малых u.
  sep_web_min: 1.0

  # Стенка венца: впадины — отверстие — кромка, мм; у тела можно переопределить
  # (wall_min в rollers). Больше — больше D.
  wall_min: 4.0

  # Ø входного вала в эксцентрике, мм (Д-40): по нему подбирается подшипник генератора,
  # входит в ID; на шаге 2 вал может быть толще (designs[].shaft.d), если проходит
  # стенка эксцентрика (проверка там же).
  shaft_d_min: 6.0

  # Стенка эксцентрика, мм: d ≥ shaft_d_min + 2·(aω + ecc_wall_min).
  # Больше — крупнее генератор при малых u.
  ecc_wall_min: 1.0

  # Округление вверх Dотв и D, мм (Д-35); проверка d_out_max — после округления.
  d_bc_step: 0.1
  d_out_step: 1.0

  # Осевой зазор или шайба между рядами, мм — входит в ширину пакета B.
  row_gap: 1.0

  # Число рядов и фазы эксцентриков, град (Д-08: 4 ряда, 0/90/180/270);
  # длина row_phases = rows. Сдвиг сверловки венцов — Д-19.
  rows: 4
  row_phases: [0, 90, 180, 270]

  # Округление вверх Dг эксцентрика, мм — только eccentric.
  dgen_step: 0.1

  # Обод .18 (CP-96, OQ-48). В ID не входят — в хэше подшипник обода (Д-120).
  # Наименьшая радиальная толщина обода, мм; допускаемая овализация / aω (0.05 — оценка);
  # коэффициент овализации δ = k·P·r³/(E·I): 0.0068 — 2-я гармоника разности нагрузок,
  # 0.149 — строгая схема «кольцо под двумя силами»; натяг δ/D и допускаемое σθ от натяга, МПа.
  rim_t_min: 2.0
  rim_dfl_k: 0.05
  rim_k_ov: 0.0068
  rim_fit_k: 0.0004
  rim_sigma_fit: 300.0

  # Радиус жёлоба под шарик на эксцентрике / Dш, > 0.5 (Д-45, Т2); 0.52 — как у
  # шарикоподшипников. Меньше — выше допускаемая сила шарик/эксцентрик; в ID не входит.
  groove_f: 0.52

  # Зазор тела в окне сепаратора, мм (Д-46): окна (Dш + sep_gap) × (l + sep_gap);
  # входит в ID.
  sep_gap: 0.05

  # Модуль упругости, МПа, и коэффициент Пуассона — тела, венец, кольца
  # (сталь: 210000, 0.3). Герц (Д-41).
  E_mod: 210000.0
  nu: 0.3

  # Допускаемое контактное напряжение, МПа: ролик (линия) / шарик (точка).
  # Ниже — меньше M_H; калибровка — OQ-08.
  sigma_H_line: 2500.0
  sigma_H_point: 3000.0

  # Запас C0/P0 подшипника генератора. Больше — меньше M_B.
  s0_brg: 1.0

  # ─── Сепаратор .02: предел M_sep (CP-94, Д-116); не входят в ID ───
  # Перемычка ряда у выходного торца — рама Виренделя + изгиб своим рядом; допускаемое —
  # многоцикловая усталость (нагружение на каждый оборот входа): [σ] = σ₋₁/(K·S).
  # σ₋₁, МПа — только при пустом sep_grade (запасной путь, устарел, CP-103): иначе пределы
  # слоя/ядра берутся из materials.yaml по sep_grade:sep_state.
  sep_sigma_m1: 509.0
  # Концентрация в углах окон и запас усталости: K ≈ 2 при острых углах (меньше —
  # скругление r ≥ 0.3 мм), S — запас; [σ] = 509/(2·2.5) ≈ 102 МПа. Сверить — OQ-44.
  sep_K: 2.0
  sep_S: 2.5
  # CP-103 (Д-126): справочник хранит ПРЕДЕЛЫ (σ₋₁, σ_Hlim слоя и ядра), запасы — здесь.
  # Изгиб в двух точках: [σ] = min(σ₋₁ слоя/(K·S), σ₋₁ ядра/(K_δ·S·(1 − 2δ/b))), b — глубина
  # сечения элемента (перемычка, пояс, полоса), δ — слой; при 2δ ≥ b — только ядро.
  # Контакт: [σ_H] = σ_Hlim·Z_N/S_H; слой держит, если δ ≥ sep_case_k·z_τ (z_τ — глубина max τ
  # под площадкой), иначе — ядро. Сверить — OQ-44, OQ-49.
  # σ_Hlim, МПа — только при пустом sep_grade (запасной путь, устарел): 1056 = 880·1.2 —
  # прежнее допускаемое 880 при S_H 1.2.
  sep_sigma_Hlim: 1056.0
  # Запас контактной выносливости (ГОСТ 21354: 1.1 однородная, 1.2 упрочнённый слой).
  sep_S_H: 1.2
  # Коэффициент долговечности: ресурс на шаге 1 не задан — 1.0 (база циклов).
  sep_Z_N: 1.0
  # Концентрация на границе слоя K_δ (CP-103; OQ-44). Число — консервативный пин до МКЭ
  # (сейчас 2.0 = sep_K). null — считать по затуханию от радиуса скругления углов окон:
  # K_δ = 1 + (K − 1)·(r/(r+δ))², при r = 0.3 и δ = 0.4 это 1.184 (CP-112). Затухание верно
  # физически: концентрация гаснет на глубине порядка r, у границы слоя её почти нет; прежнее
  # «при r ≲ δ не затухает» — ошибка обоснования, а не расчёта. Смена значения меняет [σ] ядра
  # (у 38Х2МЮА:nitr при затухании предел задаёт слой, 121.6 вместо 90.7 МПа), но не ID.
  sep_K_depth: 2.0
  # Радиус скругления углов окон, мм — входит в K_δ при sep_K_depth: null (CP-112, OQ-44).
  # Острая кромка при азотировании пересыщается и выкрашивается; R ≥ 0.3 — требование TECH-01.
  sep_r_corner: 0.3
  # Скан длины тела при выборе из каталога, мм (CP-116, Д-127): по сетке считается M_sep(l) при
  # фиксированных n, R_Σ, a_ω, D_ш и материале; в SPEC-10 рядом с пределом по сепаратору идут
  # оптимальная длина и наибольший M_sep, а из каталога берётся лучшее тело этого диаметра.
  sep_l_scan_min: 4.0
  sep_l_scan_max: 40.0
  sep_l_scan_step: 0.5
  # Слой держит контакт, если δ ≥ k·z_τ (OQ-49).
  sep_case_k: 3.0
  # Рост σ_H у кромки стенки окна (тело доходит до кромки: запас (1.1 − 1)·aω).
  sep_k_edge: 1.2
  # CP-102 (Д-125): материал сепаратора .02. Марка и состояние — ключ materials.yaml
  # (ссылка "марка:состояние"; состояния — materials.yaml → states). Свойства марки
  # заменяют sep_sigma_m1 / sep_sigma_Hlim; у заданной марки нет предела — ошибка (CP-103).
  # Пусто — оба числа выше (запасной путь, предупреждение в SPEC-10).
  # Переопределение на вариант — u_calc … materials: ["40Х", "38Х2МЮА:nitr"].
  sep_grade: 38Х2МЮА
  sep_state: nitr

  # Пояса сепаратора между рядами окон и у торцов (CP-98, Д-118, OQ-46); в ID не входят.
  # Радиальная толщина пояса, мм; 0 — равна стенке 2.2·aω. Утолщение — наружу в зоне шайб .05,
  # не больше dвн шайбы/2 − sep_band_gap − r_in (больше — урезается с предупреждением).
  # Поднимает M_sep, только если лимитирует пояс (шаг ряда = l: пояс 0.95 мм); у K20 пояс
  # 5.95 мм и лимитирует перемычка — усиление не помогает. CAD пояса пока нет.
  sep_band_t: 0.0
  # Радиальный зазор утолщённого пояса до шайбы .05, мм.
  sep_band_gap: 0.2

  # Требуемый допускаемый момент M, Н·м; 0 — не проверяется. M < M_min — ошибка.
  M_min: 0.0

  # ─── Предварительный эксцентрик и шайбы шага 1: не входят в ID (Д-48, Д-53) ───
  # На шаге 1 считаются только для оценки; окончательные вал, шпонка и балансировка —
  # шаг 2 (designs[] в ptk_design_input.yaml), там переопределяются.

  # Плотность стали эксцентрика, тел, колец, кг/м³ — массы и балансировка.
  rho: 7850.0

  # Масса подшипника, кг: сплошное кольцо D×d×B, если в bearings нет m.
  brg_mass_k: 0.35

  # Шпоночный паз: ширина b и глубина в ступице t2, мм — keys.table шага 2 по shaft.d.
  shaft_key_b: 2.0
  shaft_key_t2: 1.0

  # Паз ряда 1 от эксцентриситета, град; ряд k — key_angle − φk (шаг 2, key_angle).
  key_angle: 45.0

  # Отверстия балансировки шага 1: стенка у отверстий, мм; наибольшее число, шт;
  # Ø от и шаг, мм. На шаге 2 — balance.wall / balance.n_max / balance.drills.
  bal_wall: 1.0
  bal_n_max: 3
  bal_d_min: 1.0
  bal_d_step: 0.1

  # Зазор dвн шайбы .05 над DВ венца, мм: тела и сепаратор шайбу не касаются (Д-53).
  spacer_gap: 0.5

# Как попадать крепления в таблицу, когда их несколько:
#   first_ok (по умолчанию) — первое прошедшее все проверки; если ни одно —
#     первое по списку, с его ошибками;
#   all — все крепления, по строке на каждое.
# Порядок записей в ring_mounts — приоритет: первым основное (крупнее болт,
# больше M крепл.), за ним запасные для тесных случаев.
mount_mode: first_ok

# Крепления венца (Д-16, Д-33): ключ — только имя (в скобках в колонке «Отверстия»
# и в поле mount; в ID не входит, состав отверстий входит). Каждая тройка
# (u, тело, генератор) считается со всеми креплениями в порядке записи.
# Одни и те же отверстия крепят редуктор в машине и базируют венец на оснастке
# станков (ЭЭС, фрезерование); штифты H7 задают угловое положение.
# Без штифтов (pins: 0) угловую фазу ряда держать нечем — только для проверки.
ring_mounts:
  M6x24P2: {bolt: M6, n: 22, pins: 2, pin_d: 6.0, head_margin: 0.5, web_min: 1.0, mu: 0.12, safety: 1.5}
  M5x24P2: {bolt: M5, n: 22, pins: 2, pin_d: 5.0, head_margin: 0.5, web_min: 1.0, mu: 0.12, safety: 1.5}
  M5x12P2: {bolt: M5, n: 10, pins: 2, pin_d: 5.0, head_margin: 0.5, web_min: 1.0, mu: 0.12, safety: 1.5}
  M4x12P2:
    bolt: M4          # резьба, ключ таблицы fasteners; нет в таблице — ошибка
    n: 10              # число болтов; болт j на угле j·360°/n
    pins: 2           # штифты посередине промежутков j = round(i·n/pins); 0 — без штифтов
    pin_d: 4.0        # Ø штифта, мм
    head_margin: 0.5  # зазор от головки до впадин и до кромки, мм — входит в c
    web_min: 1.0      # перемычка между головками или головкой и штифтом, мм — шаг отверстий
    mu: 0.12          # трение в стыке венец/корпус (сталь, сухо: 0.1…0.15) — M крепл.
    safety: 1.5       # запас: M ≤ M крепл./safety — ограничивает M (Д-41)
  M3x12P2: {bolt: M3, n: 10, pins: 2, pin_d: 3.0, head_margin: 0.5, web_min: 1.0, mu: 0.12, safety: 1.5}
  M3x8P2: {bolt: M3, n: 6, pins: 2, pin_d: 3.0, head_margin: 0.5, web_min: 1.0, mu: 0.12, safety: 1.5}

# Таблица крепежа: d_clear — Ø отверстия под болт (ISO 273, средний ряд), мм;
# dk — Ø головки винта с цилиндрической головкой (ISO 4762), мм; F_M — ориентировочная
# сила затяжки, кН (кл. 8.8, μ резьбы 0.12, VDI 2230).
# Значения сверить со справочником; новый размер добавляется строкой, например
# M10: {d_clear: 11.0, dk: 16.0, F_M: 27.0}.
fasteners:
  M3: {d_clear: 3.4, dk: 5.5, F_M: 2.2}
  M4: {d_clear: 4.5, dk: 7.0, F_M: 4.1}
  M5: {d_clear: 5.5, dk: 8.5, F_M: 6.6}
  M6: {d_clear: 6.6, dk: 10.0, F_M: 9.3}
  M8: {d_clear: 9.0, dk: 13.0, F_M: 17.2}
