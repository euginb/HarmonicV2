# Входные параметры калькулятора ПТК — шаг 1 «Расчёт» (Д-16, Д-79).
# Формат — YAML (Д-79): описание каждого параметра — в комментарии рядом с ним,
# логика и формулы — instructions/INS-10_PTK_CALC.md.
# Запуск: python main.py calc --publish (шаг 1 отдельно) или полный прогон python main.py.
# Результат — specs/ptk_configs.json и specs/SPEC-10_PTK_CALC.md: их пишет машина,
# руками не править (code-first).

limits:
  # Наибольший наружный диаметр венца D, мм: 110 — станки и оснастка EG-MACHINES (Д-08);
  # null — без предела (Д-43). D больше предела — ошибка; колонка «Dш max» считается
  # только при заданном пределе.
  d_out_max: 203.0

  # CP-103 (A-5): границы одноступенчатого диапазона [u_min, u_max] явно; не задано — первый
  # и последний u таблицы u_calc (Д-119). Нужно, если в u_calc один u (быстрый прогон).
  # В ID не входит.
  # u_range: [10, 63]

  # ─── Таблица расчёта по u (CP-99, CP-101; Д-123, Д-124) ────────────────────────
  # Ключ верхнего уровня — u (передаточное число) или ALL — параметры для всех u.
  # Значение — таблица этого u: ключ ALL — параметры для всех вариантов этого u,
  # ключ M_req — вариант расчёта: целевой момент, Н·м, значение — параметры варианта.
  # Слои (следующий перекрывает предыдущий, список заменяется целиком):
  #   u_calc.ALL.ALL  →  u_calc[u].ALL  →  u_calc[u][M_req]
  # Состав ключей u, кроме ALL, задаёт таблицу SPEC-10 и границы одноступенчатого
  # диапазона: первый и последний u — это u_min…u_max (Д-08, Д-11, Д-119).
  # Пустая таблица вариантов ({}) — прямая постановка: M получается следствием габарита.
  # Варианты с M_req — обратная постановка (Д-121): калькулятор поднимает RΣ (dR),
  # перебирает крепления и пояс сепаратора так, чтобы M ≥ M_req при наименьшем D, затем B.
  # Несколько вариантов у одного u — несколько решений по этому u.
  #
  # Параметры слоя или варианта (все необязательны):
  #   r_step      — шаг подъёма RΣ, мм            (по умолчанию limits.r_step);
  #   r_up_max    — наибольший подъём RΣ, мм      (по умолчанию limits.r_up_max);
  #   band_h_list — высоты пояса сепаратора, мм   (по умолчанию limits.band_h_list);
  #   mounts      — перечень креплений ring_mounts, по которым считать этот u/вариант;
  #   rollers     — перечень тел качения vendor_prices → rollers;
  #   gen_types   — типы генератора (bearing | rim | eccentric).
  # Перечень — список имён; пустой список [] или отсутствие ключа — без ограничения (все).
  # Имя не из ring_mounts / rollers — ошибка: это опечатка, а не «нет такого варианта».
  # materials   — перечень марок сепаратора .02, "марка[:состояние]" из materials.yaml
  #               (CP-102, CP-103); неизвестная марка — ошибка при загрузке конфига.
  # материалов.
  u_calc:
    ALL:
      # [] — без ограничения: как в прямой постановке
      ALL:
        mounts: [M6x24P2, M5x12P2, M4x12P2, M3x12P2, M3x8P2]
        rollers: [R_D8x16, R_D8x8, R_D7x20, R_D6x6, R_D6x8, R_D5x8, R_D5x5, R_D4x12, R_D3x8, B_D3]
        # ─── Перебор под M_req: значения по умолчанию для всех вариантов u_calc ────────
        # Шаг подъёма RΣ, мм, и наибольший подъём над RΣ min, мм (время прогона ∝ r_up_max/r_step
        # на крепление и на высоту пояса). Вариант u_calc[u][M_req] может их переопределить.
        r_step: 1.0
        r_up_max: 40.0
        # Высоты пояса сепаратора hb, мм (CP-95b): добавка к шагу ряда при переборе под M_req.
        # 0 — пояс как вышел (зазор ряда минус sep_gap). Больше высот — дольше прогон.
        band_h_list: [0, 2, 4, 6, 8]

        # Типы генератора (Д-42): bearing — тела на наружном кольце подшипника;
        # eccentric — тела прямо по эксцентрику (жёлоб groove_f). Каждая пара (u, тело)
        # считается для каждого типа; тип входит в хэш ID и в колонку «Генератор».
        # rim (CP-96) — малый подшипник на эксцентрике + обод .18, тела катятся по ободу.
        # CP-105: марки сепаратора .02 — по всем u и вариантам. Перечень заменяет марку по
        # умолчанию limits.sep_grade:sep_state целиком. 38Х2МЮА — с состоянием nitr: без него
        # ядро 392 / σ_Hlim 640 и слоя нет (CP-103), и марка теряет смысл (TECH-01).
        materials: ["40Х"]
        gen_types: [bearing, rim]
