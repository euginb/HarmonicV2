# Спецификация комплекта чертежей (Д-61). Формат — YAML (Д-79).
# Запуск: python -m egm.cad --spec specs/cad_set.yaml
#
# Читает опубликованные specs/ptk_configs.json (результат шага 1) и
# specs/ptk_designs.json (шаг 2) — их пишет машина; выход — out/cad/<ID>/*.svg|.step
# и отчёт вывода reports/cad_report.md (легенда каждой позиции).
# Каждая запись items[] — исполнение ЦЕЛИКОМ: строятся все его детали, у которых
# есть генератор (products.yaml → cad). Поля записи:
#   id     — исполнение или ID детали из SPEC-10 / ptk_configs.json (префикс без
#            хэша допустим, Д-51)
#   design — имя проработки шага 2 (designs[] в ptk_design_input.yaml, SPEC-11):
#            эксцентрики и вал — по проработке; сборка <ID>-<name>.step
#   layout — конструктив (CP-74, Д-55, Д-73): L1 | L2 | L3 или СПИСОК — свой
#            комплект чертежей на каждый код (сборка <ID>-<код>.step);
#            по умолчанию — конструктив проработки (designs[].layout, умолчание L1)
#   assy   — true: дополнительно сборка исполнения одним STEP (Д-49)
#   rows   — all (по умолчанию) или список рядов [1, 2, 3, 4] — детали только этих рядов
#   parts  — all (по умолчанию) или список позиций ["01", "05"] — только они
# Низкоуровневый путь — python -m egm.cad <ID> [--row k | --phase φ] [--assy]
# [--design NAME] — остаётся для точечных прогонов (INS-30).

step: spline        # контур впадин в STEP: spline — B-сплайн | poly — ломаная | off — без STEP
                    # приоритет: --step → здесь → configs/application.yaml cad.export.step.mode (Д-79)

items:
  - id: PTK-050-R2X4_2-8M4P2   # исполнение из SPEC-10 (префикс без хэша — Д-51)
    design: K10                # проработка шага 2 (SPEC-11)
    assy: true                 # + сборка одним STEP: <ID>-K10.step
  # Пример записи с фильтрами (раскомментировать и подставить свой ID):
  # - id: PTK-063-R2X4_2-8M4P2
  #   rows: [1, 2]              # детали только рядов 1–2
  #   parts: ["01", "05"]       # только венцы и шайбы
  # Пример записи с конструктивами (CP-74): свой комплект на каждый код списка:
  # - id: PTK-050-R2X4_2-8M4P2
  #   layout: [L2, L3]          # .02B+.12A и .02C+.12B — два комплекта, сборки <ID>-L2/-L3.step
  #   assy: true
